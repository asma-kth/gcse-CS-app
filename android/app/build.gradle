apply plugin: 'com.android.application'

// Release signing.
//
// The upload key must never live in version control. Gradle looks for a file
// called keystore.properties next to this one, which is git ignored, and falls
// back to environment variables so a CI job can sign without a file.
//
// Create it with scripts/release.sh, or by hand:
//   storeFile=/absolute/path/to/byte-quest-upload.jks
//   storePassword=...
//   keyAlias=upload
//   keyPassword=...
def keystorePropertiesFile = rootProject.file("app/keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def resolvedStoreFile = keystoreProperties['storeFile'] ?: System.getenv('BQ_STORE_FILE')
def resolvedStorePassword = keystoreProperties['storePassword'] ?: System.getenv('BQ_STORE_PASSWORD')
def resolvedKeyAlias = keystoreProperties['keyAlias'] ?: System.getenv('BQ_KEY_ALIAS')
def resolvedKeyPassword = keystoreProperties['keyPassword'] ?: System.getenv('BQ_KEY_PASSWORD')
def canSignRelease = resolvedStoreFile != null && file(resolvedStoreFile).exists()

android {
    namespace "com.bytequest.gcsecs"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.bytequest.gcsecs"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (canSignRelease) {
                storeFile file(resolvedStoreFile)
                storePassword resolvedStorePassword
                keyAlias resolvedKeyAlias
                keyPassword resolvedKeyPassword
            }
        }
    }

    buildTypes {
        release {
            // Shrinking is off because the app is a WebView shell. Almost all of
            // the code is the JavaScript bundle, which Vite has already minified,
            // so R8 would add build time and crash risk for very little gain.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (canSignRelease) {
                signingConfig signingConfigs.release
            } else {
                logger.warn("No upload keystore found. The release build will be UNSIGNED and Play will reject it. Run scripts/release.sh to set one up.")
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
