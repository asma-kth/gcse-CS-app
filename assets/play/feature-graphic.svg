<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b7f85"/>
      <stop offset="55%" stop-color="#055b5c"/>
      <stop offset="100%" stop-color="#033b3d"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9fdfe2"/><stop offset="100%" stop-color="#6ec6ca"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ccabd8"/><stop offset="100%" stop-color="#8474a1"/>
    </linearGradient>
    <radialGradient id="eye" cx="35%" cy="30%">
      <stop offset="0%" stop-color="#f2e6f8"/><stop offset="55%" stop-color="#b184d0"/><stop offset="100%" stop-color="#6f4f92"/>
    </radialGradient>
    <radialGradient id="torch" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#e0a02a" stop-opacity="0.42"/>
      <stop offset="70%" stop-color="#e0a02a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>
  <circle cx="120" cy="120" r="200" fill="url(#torch)"/>
  <circle cx="900" cy="400" r="180" fill="url(#torch)"/>

  <!-- faint castle skyline -->
